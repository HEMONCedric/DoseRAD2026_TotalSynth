[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doserad2026"
version = "1.0.0"
description = "Reproducible ProtonFiLM-Lite BEV dose prediction for DoseRAD2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "blosc2==3.7.2",
  "numpy==1.26.4",
  "scipy==1.15.3",
  "SimpleITK==2.4.0",
  "tensorboard==2.18.0",
  "torch==2.7.1",
]

[project.optional-dependencies]
sct = [
  "huggingface-hub==1.0.1",
  "konfai==1.6.0",
  "segmentation-models-pytorch==0.5.0",
]
docker = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["doserad2026*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
