[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doserad2026"
version = "0.1.0"
description = "Utilities and baselines for the DoseRAD2026 challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
imaging = [
  "numpy>=1.26",
  "SimpleITK>=2.3",
  "pandas>=2.0",
  "openpyxl>=3.1",
]
training = [
  "torch>=2.2",
  "monai>=1.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
doserad-index = "doserad2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
